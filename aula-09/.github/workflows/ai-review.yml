
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "aula-09/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    name: Static AI Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate pull request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --no-ext-diff --unified=0 "$BASE_SHA...$HEAD_SHA" -- aula-09 > "$RUNNER_TEMP/ai-review.diff"

      - name: Analyze diff
        id: analysis
        continue-on-error: true
        run: node .github/scripts/ai-review.js "$RUNNER_TEMP/ai-review.diff" > "$RUNNER_TEMP/ai-review.json"

      - name: Comment on pull request
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ runner.temp }}/ai-review.json
        with:
          script: |
            const fs = require('fs');

            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              throw new Error('Número do Pull Request não encontrado.');
            }

            const { owner, repo } = context.repo;
            const COMMENT_HEADER = '<!-- ai-review-bot -->';

            let report;
            try {
              report = JSON.parse(
                fs.readFileSync(process.env.REPORT_PATH, 'utf8')
              );
            } catch {
              report = null;
            }

            let body = `${COMMENT_HEADER}\n## AI Code Review\n\n`;

            if (!report) {
              body += '**Status: análise não concluída.** Verifique os logs do job.\n';
            } else {
              body += `**Quality Gate: ${report.gate}**\n\n`;
              body += `- CRITICAL: ${report.counts.CRITICAL}\n`;
              body += `- WARNING: ${report.counts.WARNING}\n`;
              body += `- INFO: ${report.counts.INFO}\n\n`;

              if (report.findings.length === 0) {
                body += 'Nenhum padrão sinalizado foi encontrado nas linhas adicionadas.\n';
              } else {
                body += '### Achados\n\n';
                for (const f of report.findings) {
                  const code = String(f.code)
                    .replace(/`/g, "'")
                    .slice(0, 120);
                  body += `- **${f.severity}: ${f.title}** (linha ${f.line})\n`;
                  body += `  ${f.description}\n`;
                  body += `  Trecho: \`${code}\`\n\n`;
                }
              }
            }

            const { data: comments } =
              await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
              });

            const existing = comments.find(
              (c) => c.user.type === 'Bot' &&
                     c.body.includes(COMMENT_HEADER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Apply quality gate
        if: steps.analysis.outcome == 'failure'
        run: exit 1
