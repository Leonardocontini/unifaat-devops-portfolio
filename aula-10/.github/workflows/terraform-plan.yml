name: Terraform — Plan on PR

# Requer três secrets configurados no repositório com as credenciais
# temporárias do Learner Lab (renovar a cada sessão):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_SESSION_TOKEN
#
# Em produção fora do Lab, o padrão ideal é OIDC + IAM Role, sem chaves:
#   permissions: { id-token: write }
#   uses: aws-actions/configure-aws-credentials@v4 com role-to-assume
# O Lab não permite criar OIDC provider nem roles IAM, por isso usamos secrets.

on:
  pull_request:
    branches:
      - main
    paths:
      - "aula-10/terraform/**/*.tf"
      - "aula-10/terraform/**/*.tfvars"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # necessário para postar comentário no PR

env:
  TF_VERSION: "1.9.5"
  TF_WORKING_DIR: aula-10/terraform
  AWS_REGION: us-east-1

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Verificar identidade AWS
        run: aws sts get-caller-identity

      - name: Instalar Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: terraform init
        id: init
        run: terraform init

      - name: terraform validate
        id: validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -no-color \
            -out=tfplan \
            2>&1 | tee plan-output.txt
        continue-on-error: true

      # ── Detecta operações de destroy e marca como atenção ──────────────────
      - name: Verificar destruições
        id: destroy-check
        run: |
          if grep -q "will be destroyed" plan-output.txt 2>/dev/null; then
            echo "has_destroy=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_destroy=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Posta (ou atualiza) o plan como comentário no PR ───────────────────
      - name: Comentar plan no PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planText = fs.readFileSync(
              '${{ env.TF_WORKING_DIR }}/plan-output.txt', 'utf8'
            ).trim();

            const fmtStatus  = '${{ steps.fmt.outcome }}';
            const initStatus = '${{ steps.init.outcome }}';
            const valStatus  = '${{ steps.validate.outcome }}';
            const planStatus = '${{ steps.plan.outcome }}';
            const hasDestroy = '${{ steps.destroy-check.outputs.has_destroy }}' === 'true';

            const icon = (s) => s === 'success' ? '✅' : '❌';
            const destroyWarning = hasDestroy
              ? '\n> ⚠️ **ATENÇÃO: este plan contém operações de DESTROY!** Revise antes de mergear.\n'
              : '';

            const body = [
              '## 🔧 Terraform Plan — Resultado',
              destroyWarning,
              `| Etapa | Status |`,
              `|-------|--------|`,
              `| \`terraform fmt\` | ${icon(fmtStatus)} ${fmtStatus} |`,
              `| \`terraform init\` | ${icon(initStatus)} ${initStatus} |`,
              `| \`terraform validate\` | ${icon(valStatus)} ${valStatus} |`,
              `| \`terraform plan\` | ${icon(planStatus)} ${planStatus} |`,
              '',
              '<details>',
              '<summary>📋 Output completo do plan (clique para expandir)</summary>',
              '',
              '```hcl',
              planText.length > 60000
                ? planText.slice(0, 60000) + '\n... [truncado — veja os logs completos]'
                : planText,
              '```',
              '',
              '</details>',
              '',
              `> Executado por: @${{ github.actor }} | Commit: \`${{ github.sha }}\``,
            ].join('\n');

            // Atualiza comentário existente para não criar duplicatas
            const marker = '## 🔧 Terraform Plan — Resultado';
            const { data: comments } = await github.rest.issues.listComments({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Falha o workflow se o plan falhou — impede o merge
      - name: Falhar se plan falhou
        if: steps.plan.outcome == 'failure'
        run: |
          echo "::error::terraform plan falhou. Corrija os erros antes de mergear."
          exit 1
